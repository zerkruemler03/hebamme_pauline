name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Exakte Version aus .nvmrc – haelt CI und lokale Umgebung identisch
          # und vermeidet den sporadischen npm-10.9.x-Bug "Exit handler never called!".
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # Registry kommt aus der committeten .npmrc (oeffentliche npm-Registry).
        # Kein --registry-Flag: in Kombination mit npm 10.9.x ein bekannter Ausloeser
        # fuer "Exit handler never called!". Ein Retry faengt sporadische Fehler ab.
        run: npm ci || (echo "npm ci retry" && npm cache clean --force && npm ci)

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
